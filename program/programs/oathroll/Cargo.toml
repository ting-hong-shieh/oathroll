[package]
name = "oathroll"
version = "0.1.0"
description = "Oathroll: an AI game master whose rulings are sealed on Solana before the dice exist"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "oathroll"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }
